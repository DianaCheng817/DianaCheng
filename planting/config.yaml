# ============================================================
# 种植灌溉与农事记录 · 调研智能体 全局配置
# 规则：所有密钥 / 模型地址 / 路径 只允许出现在本文件，禁止硬编码进代码
# ============================================================

app:
  name: "planting-irrigation-agent"      # 服务名称，仅用于日志与文档展示
  version: "1.0.0"                       # 版本号，与 docs/06-技术方案.md 保持一致
  debug: false                           # 开启后 FastAPI 返回详细错误，生产必须关闭

service:
  host: "127.0.0.1"                      # 只监听本机回环，默认不对外网暴露
  port: 8000                             # 服务端口
  reload: false                          # 热重载，仅本地调试时开启

# ---------- 本地大模型（Ollama） ----------
ollama:
  enabled: true                          # true 时优先调用本地模型；不可用自动降级为模板引擎
  base_url: "http://127.0.0.1:11434"     # Ollama 默认地址，按本机实际端口修改
  # 需与 `ollama list` 中的名称完全一致。本机已安装 qwen3:0.6b；
  # 若拉取了更大的模型（如 qwen2.5:7b），改这里即可，无需改代码。
  model_name: "qwen3:0.6b"               # 本地模型名
  timeout: 120                           # 单次生成超时（秒）
  temperature: 0.2                       # 低温度，减少自由发挥导致的事实漂移
  num_predict: 2048                      # 单次最大生成 token
  fallback_to_template: true             # 模型不可用时是否降级为模板引擎（保证服务可用）

# ---------- 知识图谱（知识库） ----------
knowledge_graph:
  persist_path: "./kg_store/irrigation_kg.json"   # 图谱持久化路径（JSON node-link）
  seed_on_startup: true                           # 启动时若文件不存在，用内置种子数据初始化
  evidence_total: 36                              # 合法证据编号总量 f00–f55 中的实际条目数
  evidence_max_index: 55                          # 证据编号上界，超过即判定为虚构编号

# ---------- Harness 合规校验 ----------
harness:
  # 禁止出现在输出中的「方案型」表述：首期边界不允许自动控制
  forbidden_keywords:
    - "自动控制泵阀"
    - "自动开启泵阀"
    - "自动开阀"
    - "自动灌溉"
    - "自动启泵"
    - "无人值守灌溉"
  # 访谈中不存在的角色，出现即视为事实错配
  banned_roles:
    - "农户"
    - "台账管理员"
    - "设备维护员"
    - "节水监管专员"
    - "运维人员"
    - "灌区管理者"
    - "灌区管理单位"
  # 未经访谈确认的地块 / 作物 / 编号，出现即判定为虚构
  banned_entities:
    - "西区 3 号"
    - "西区3号"
    - "夏季叶菜"
    - "低洼试验田"
    - "E01"
    - "R01"
    - "R02"
  # 未经样本验证的自创数值区间
  banned_numbers:
    - "25–40 分钟"
    - "25-40 分钟"
    - "25~40 分钟"
    - "4–7 次"
    - "4-7 次"
  # 输出必须出现的边界声明之一（满足任意一条即可）
  required_boundary_markers:
    - "不自动控制泵阀"
    - "观测解释与灌溉建议"
    - "只读"
  # 出现数字型指标时必须同时出现的验证性标注
  verification_markers:
    - "待样本验证"
    - "待验证"
    - "待采集"
    - "待核实"
    - "待补"
    - "访谈确认"          # 用于区分「访谈里明确给出、但未经抽样复核」的数值
  # 允许在输出中点名的六个合法角色
  allowed_roles:
    - "顾明岚"
    - "林亦舟"
    - "唐映秋"
    - "秦芮"
    - "傅景"
    - "叶书"
  # 单项检查未通过时是否阻断整个请求
  block_on_fail: true

# ---------- 文档产出 ----------
docs:
  tech_solution_md: "./docs/06-技术方案.md"
  tech_solution_docx: "./docs/06-技术方案.docx"
  prompt_md: "./docs/07-智能体提示词.md"

# ---------- 鉴权与分层权限 ----------
# 角色三级：admin（管理员/SaaS）、user（注册用户）、guest（访客，不入库）
auth:
  jwt_secret: ""                # 留空时读取环境变量 JWT_SECRET；生产部署必须通过环境变量设置
  token_expire_hours: 12        # 登录令牌有效期（小时）
  admin_username: ""            # 首次启动初始化管理员账号，留空读环境变量 ADMIN_USERNAME
  admin_password: ""            # 首次启动初始化管理员密码，留空读环境变量 ADMIN_PASSWORD；仅入库一次
  allow_register: true          # 是否开放访客自助注册为普通用户
  users_path: "./data/users.json"   # 用户台账持久化路径（JSON，不提交真实密码哈希以外的敏感信息）

# ---------- 兼容 OpenAI 协议的远程模型（云端部署用） ----------
# 优先级：Ollama 本地模型 → 远程兼容接口 → 模板引擎降级；任一通道不可用自动顺延
remote_llm:
  enabled: false                            # 是否启用远程兼容接口
  base_url: ""                              # 如 https://api.deepseek.com/v1，留空读环境变量 REMOTE_LLM_BASE_URL
  api_key: ""                               # 留空读环境变量 OPENAI_API_KEY，禁止把真实密钥写进本文件
  model_name: ""                            # 留空读环境变量 REMOTE_LLM_MODEL
  timeout: 60                               # 单次生成超时（秒）
  temperature: 0.2                          # 低温度，减少事实漂移
  max_tokens: 2048                          # 单次最大生成 token

# ---------- RAG 检索 ----------
rag:
  top_k: 5                    # 单次问答注入的证据块上限
  doc_chunk_chars: 300        # 文档切块的目标字符长度
  docs_dir: "./docs"          # 参与检索的调研文档目录（仅读取 md）
